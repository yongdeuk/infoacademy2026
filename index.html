<meta charset="utf-8">
<title>block2python</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Nanum+Gothic:wght@400;700;800&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════
   block2python — 엔트리 블록과 파이썬 코드를 나란히 맞춰보는 작업대
   광주 중등 정보 교과 아카데미 (2026)
   ══════════════════════════════════════════════════════════════ */

:root{
  --font-ui:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --font-mono:'IBM Plex Mono','D2Coding','Consolas',monospace;
  --font-block:'Nanum Gothic','Malgun Gothic',sans-serif;

  /* 크롬 : 푸른 기가 아주 살짝 도는 무채색 */
  --bg:#EDF0F4;
  --surface:#FFFFFF;
  --surface-2:#F4F6F9;
  --canvas:#F2F4F7;
  --dot:#D3D9E2;
  --line:#D5DCE5;
  --line-soft:#E5EAF1;
  --ink:#171C24;
  --ink-2:#4B5666;
  --ink-3:#79859A;

  /* 에디터 */
  --code-bg:#FBFCFE;
  --code-line:#EEF2F7;
  --code-gutter:#98A4B5;
  --syn-kw:#8A3FFC;
  --syn-fn:#0F62FE;
  --syn-str:#0E7C5A;
  --syn-num:#B45309;
  --syn-com:#8B97A8;
  --syn-op:#4B5666;

  /* 상태 */
  --ok:#127A56;      --ok-bg:#E2F4EC;   --ok-line:#8FD5BC;
  --bad:#C0392F;     --bad-bg:#FBEBE9;  --bad-line:#EFA9A2;
  --warn:#9A6608;    --warn-bg:#FDF2DE;
  --hl:#FFC53D;      --hl-soft:#FFF3D2;

  /* 현재 개념 색 (JS가 갈아끼움) */
  --accent:#dd47d8;
  --accent-dark:#b819b3;
  --accent-wash:#dd47d814;

  --r-s:6px; --r-m:10px; --r-l:14px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F14;
    --surface:#141920;
    --surface-2:#1A212A;
    --canvas:#10151C;
    --dot:#232C38;
    --line:#28313D;
    --line-soft:#1F2731;
    --ink:#E8EDF3;
    --ink-2:#AEB9C7;
    --ink-3:#7E8A9A;
    --code-bg:#0F141A;
    --code-line:#1A222C;
    --code-gutter:#5D6878;
    --syn-kw:#C6A0FF;
    --syn-fn:#78A9FF;
    --syn-str:#6FD3A6;
    --syn-num:#F2A65A;
    --syn-com:#6B7686;
    --syn-op:#AEB9C7;
    --ok:#54C79A;      --ok-bg:#0F2A21;   --ok-line:#2C6B54;
    --bad:#F08B80;     --bad-bg:#2C1615;  --bad-line:#7A3B34;
    --warn:#E0AC5A;    --warn-bg:#2A2013;
    --hl:#FFC53D;      --hl-soft:#2E2718;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F14;
  --surface:#141920;
  --surface-2:#1A212A;
  --canvas:#10151C;
  --dot:#232C38;
  --line:#28313D;
  --line-soft:#1F2731;
  --ink:#E8EDF3;
  --ink-2:#AEB9C7;
  --ink-3:#7E8A9A;
  --code-bg:#0F141A;
  --code-line:#1A222C;
  --code-gutter:#5D6878;
  --syn-kw:#C6A0FF;
  --syn-fn:#78A9FF;
  --syn-str:#6FD3A6;
  --syn-num:#F2A65A;
  --syn-com:#6B7686;
  --syn-op:#AEB9C7;
  --ok:#54C79A;      --ok-bg:#0F2A21;   --ok-line:#2C6B54;
  --bad:#F08B80;     --bad-bg:#2C1615;  --bad-line:#7A3B34;
  --warn:#E0AC5A;    --warn-bg:#2A2013;
  --hl:#FFC53D;      --hl-soft:#2E2718;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.wrap{max-width:1300px;margin:0 auto;padding:26px 20px 64px}

/* ── 머리말 ───────────────────────────────────────── */
.head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:2px;font-family:var(--font-mono);
  font-size:31.5px;font-weight:600;letter-spacing:-.02em}
.brand .b2{color:var(--accent);transition:color .3s}
.head-sub{font-size:16px;color:var(--ink-2);max-width:46ch;margin-top:2px}
.head-meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:14px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--surface)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  width:36px;height:36px;display:grid;place-items:center;font-size:17px;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--ink-3);color:var(--ink)}

/* ── 개념 레일 ─────────────────────────────────────── */
.rail{display:flex;gap:7px;margin:18px 0 0;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.unit-btn{display:flex;align-items:center;gap:8px;padding:8px 15px 8px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;font-size:16px;color:var(--ink-2);
  white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.unit-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.unit-btn .swatch{width:10px;height:10px;border-radius:3px;flex:none;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.unit-btn .n{font-family:var(--font-mono);font-size:13.5px;color:var(--ink-3)}
.unit-btn[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.unit-btn[aria-selected="true"] .n{color:rgba(255,255,255,.75)}
.unit-btn[aria-selected="true"] .swatch{background:rgba(255,255,255,.9)!important;box-shadow:none}

/* ── 개념 머리 ─────────────────────────────────────── */
.u-head{margin:24px 0 14px;display:flex;gap:24px;align-items:stretch;flex-wrap:wrap}
.u-head-main{flex:1 1 460px;min-width:min(100%,32ch);padding:2px 0}
.u-title{font-size:26.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;text-wrap:balance;margin:0}
.u-title .cat{font-size:14.5px;font-weight:500;color:#fff;background:var(--accent);
  border-radius:4px;padding:2px 8px;vertical-align:6px;margin-right:9px;
  font-family:var(--font-block);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.u-lead{font-size:16.5px;color:var(--ink-2);max-width:62ch;margin:6px 0 0}
.u-quote{position:relative;margin:0;flex:0 1 420px;min-width:min(100%,300px);
  display:flex;flex-direction:column;justify-content:center;gap:10px;
  padding:18px 22px 16px 52px;background:var(--accent-wash);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r-m)}
.u-quote::before{content:'“';position:absolute;left:16px;top:4px;font-size:52px;line-height:1;
  color:var(--accent);opacity:.5;pointer-events:none}
.u-quote .qt{margin:0;font-size:19.5px;line-height:1.55;font-weight:500;color:var(--ink);
  text-wrap:balance;word-break:keep-all}
.u-quote cite{font-style:normal;font-size:13.5px;color:var(--ink-3);
  padding-top:9px;border-top:1px solid var(--line);letter-spacing:.02em}
.u-quote cite b{font-weight:500;color:var(--accent)}
@media (max-width:980px){.u-quote{flex:1 1 100%}}

/* ── 모드 세그먼트 ─────────────────────────────────── */
.modes{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-m);padding:3px;gap:2px;margin-bottom:18px;flex-wrap:wrap}
.mode-btn{border:0;background:transparent;border-radius:7px;padding:6px 14px;font-size:16px;
  color:var(--ink-2);transition:background .15s,color .15s}
.mode-btn:hover{color:var(--ink)}
.mode-btn[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .mode-btn[aria-selected="true"]{box-shadow:none;background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mode-btn[aria-selected="true"]{box-shadow:none;background:var(--accent);color:#fff}}

/* ── 패널 공통 ─────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:14.5px;
  border-bottom:1px solid var(--line-soft);color:var(--ink-2)}
.panel-hd .dot{width:9px;height:9px;border-radius:3px;flex:none}
.panel-hd .hint{margin-left:auto;font-size:13.5px;color:var(--ink-3)}
.lbl{font-size:13.5px;letter-spacing:.07em;color:var(--ink-3);font-weight:500;margin:0 0 8px}

/* ── 대조 레이아웃 ─────────────────────────────────── */
.bridge{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);align-items:stretch;gap:0}
.bridge-arrow{display:grid;place-items:center;color:var(--ink-3);font-size:23px}
@media (max-width:1080px){
  .bridge{grid-template-columns:minmax(0,1fr);gap:10px}
  .bridge-arrow{transform:rotate(90deg);padding:2px 0}
}

/* ── 엔트리 조립소 ─────────────────────────────────── */
.canvas{background:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:15px 15px;padding:16px 16px 22px;overflow-x:auto;min-height:100%}
.stack{display:flex;flex-direction:column;align-items:flex-start;min-width:max-content}

.eb{position:relative;display:flex;align-items:center;gap:6px;min-height:35px;padding:6px 14px;
  border-radius:4px;color:#fff;font-family:var(--font-block);font-size:14.5px;font-weight:700;
  line-height:1.35;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
  background:var(--bc);transition:box-shadow .12s,filter .12s;text-align:left}
.eb::after{content:'';position:absolute;left:17px;bottom:-3px;width:17px;height:4px;
  background:var(--bc);border-radius:0 0 4px 4px}
.eb.hat{border-radius:17px 17px 4px 4px;padding-top:10px;min-height:42px}
.eb[data-line]{cursor:pointer}
.eb[data-line]:hover{filter:brightness(1.07)}
.eb.sel{box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 0 0 3px var(--hl)}
.eb.exec{box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 0 0 3px var(--hl),0 0 0 7px var(--hl-soft)}

.ef{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:12px;
  background:#fff;color:#16181D;font-weight:700;font-size:14px;white-space:pre}
.ef.drop{background:var(--bd);color:#fff;border-radius:3px;padding-right:22px;position:relative}
.ef.drop::after{content:'';position:absolute;right:7px;top:calc(50% - 2px);
  border:4px solid transparent;border-top-color:#fff}
.ei{display:inline-flex;align-items:center;gap:5px;min-height:27px;padding:2px 12px;border-radius:14px;
  color:#fff;font-size:14px;font-weight:700;background:var(--ic);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.17)}
.ei.bool{border-radius:0;padding:2px 15px;box-shadow:none;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}

.ebc{display:flex;flex-direction:column;align-items:flex-start;position:relative}
.ebc-top{border-radius:4px 4px 0 0}
.ebc-top::after,.ebc-mid::after{display:none}
.ebc-row{display:flex;align-self:stretch}
.ebc-spine{width:17px;flex:none;background:var(--bc)}
.ebc-in{display:flex;flex-direction:column;align-items:flex-start;padding:4px 0 6px 3px;min-width:60px}
.ebc-mid{border-radius:0;margin-top:-1px}
.ebc-bot{min-height:15px;height:15px;width:84px;border-radius:0 0 4px 4px;padding:0}
.ebc-bot::after{left:17px}
.eb-note{font-family:var(--font-ui);font-size:13.5px;color:var(--ink-3);padding:5px 0 5px 4px;font-weight:400}

/* ── 파이썬 에디터 ─────────────────────────────────── */
.editor{background:var(--code-bg);min-height:100%;display:flex;flex-direction:column}
.ed-bar{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line-soft);
  font-family:var(--font-mono);font-size:13.5px;color:var(--ink-3)}
.ed-bar .lamp{width:9px;height:9px;border-radius:50%;flex:none}
.ed-body{overflow-x:auto;padding:10px 0 14px}
.pl{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:start;
  font-family:var(--font-mono);font-size:16px;line-height:27px;min-width:max-content}
.pl .ln{color:var(--code-gutter);text-align:right;padding-right:13px;font-size:14px;
  line-height:27px;-webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums}
.pl .src{white-space:pre;padding-right:18px;color:var(--ink)}
.pl[data-line]{cursor:pointer}
.pl[data-line]:hover .src{background:var(--code-line)}
.pl.sel .src,.pl.exec .src{background:var(--hl-soft);box-shadow:inset 3px 0 0 var(--hl)}
.pl.exec .ln{color:var(--ink);font-weight:600}
.tk-kw{color:var(--syn-kw);font-weight:500}
.tk-fn{color:var(--syn-fn)}
.tk-st{color:var(--syn-str)}
.tk-nu{color:var(--syn-num)}
.tk-cm{color:var(--syn-com);font-style:italic}
.tk-op{color:var(--syn-op)}

/* ── 연계 포인트 카드 ──────────────────────────────── */
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:16px}
.gap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 15px;border-left:3px solid var(--accent)}
.gap h4{margin:0 0 5px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.gap h4 .mark{font-family:var(--font-mono);font-size:12px;color:#fff;background:var(--accent);
  border-radius:3px;padding:1px 5px;font-weight:500}
.gap p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.65}
.gap code{font-family:var(--font-mono);font-size:14.5px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:4px;padding:0 4px}

/* ── 실행 ─────────────────────────────────────────── */
.runbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:9px 12px}
.rb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:var(--r-s);padding:6px 13px;font-size:15px;color:var(--ink)}
.rb:hover:not(:disabled){border-color:var(--ink-3)}
.rb:disabled{opacity:.4;cursor:default}
.rb.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.rb.primary:hover:not(:disabled){filter:brightness(1.08)}
.runbar .step-state{margin-left:auto;font-size:14.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.io{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:900px){.io{grid-template-columns:minmax(0,1fr)}}
.console{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.console-body{font-family:var(--font-mono);font-size:15px;line-height:1.8;padding:12px 15px;
  min-height:122px;max-height:290px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.console-body .ask{color:var(--ink-3)}
.console-body .err{color:var(--bad)}
.console-body .empty{color:var(--ink-3);font-family:var(--font-ui);font-size:14.5px}
.vars{display:flex;flex-wrap:wrap;gap:8px;padding:12px 15px;min-height:122px;align-content:flex-start}
.vchip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-s);
  overflow:hidden;font-size:14.5px;background:var(--surface-2)}
.vchip .k{padding:3px 8px;font-family:var(--font-mono);color:var(--ink-2);border-right:1px solid var(--line)}
.vchip .v{padding:3px 9px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  background:var(--surface);color:var(--ink)}
.vchip.changed{border-color:var(--hl);box-shadow:0 0 0 2px var(--hl-soft)}
.vchip.changed .v{background:var(--hl-soft);font-weight:600}
.vars .empty{color:var(--ink-3);font-size:14.5px}
.inputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--ink-2)}
.inputs input{font:inherit;font-family:var(--font-mono);background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-s);padding:5px 10px;width:132px}
.edit-area{width:100%;min-height:290px;font-family:var(--font-mono);font-size:16px;line-height:27px;
  background:var(--code-bg);color:var(--ink);border:0;padding:10px 12px;resize:vertical;display:block}
.edit-area:focus{outline:2px solid var(--accent);outline-offset:-2px}

/* ── 빈칸 채우기 ───────────────────────────────────── */
[hidden]{display:none!important}
.fbbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:0 0 12px;font-size:15px;color:var(--ink-2)}
.fbbar b{font-variant-numeric:tabular-nums;color:var(--ink)}
.fbhint{flex:1 1 260px;color:var(--ink-3)}
.fb{font-family:var(--font-mono);font-size:16px;text-align:center;padding:0 6px;margin:0 2px;height:26px;
  border:0;border-bottom:2px dashed var(--accent);border-radius:6px 6px 0 0;background:var(--accent-wash);
  color:var(--ink);vertical-align:baseline;transition:background .15s,border-color .15s}
.fb:focus{outline:0;border-bottom-style:solid;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.fb.ok{border-bottom:2px solid var(--ok);background:var(--ok-bg);color:var(--ok)}
.fb.no{border-bottom:2px solid var(--bad);background:var(--bad-bg);color:var(--bad)}
.fbdone{margin-top:16px;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--ok);
  border-radius:var(--r-l);padding:20px 22px;box-shadow:var(--sh-2)}
.fbdone h3{margin:0 0 4px;font-size:20px}
.fbdone .console{margin:14px 0 16px}

/* ── 실습 문제 탭 ─────────────────────────────────── */
.lab-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-m);padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.lab-tab{border:0;background:transparent;border-radius:7px;padding:5px 13px;font-size:15px;
  color:var(--ink-2);transition:background .15s,color .15s}
.lab-tab:hover{color:var(--ink)}
.lab-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:500;
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
:root[data-theme="dark"] .lab-tab[aria-selected="true"]{box-shadow:none;background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lab-tab[aria-selected="true"]{box-shadow:none;background:var(--accent);color:#fff}}

/* ── 코드 완성 ─────────────────────────────────────── */
.fill-code{font-family:var(--font-mono);font-size:16.5px;line-height:2.1;white-space:pre-wrap;
  padding:14px 16px;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r-l)}
.blank{display:inline-block;min-width:92px;text-align:center;border:1px dashed var(--ink-3);
  border-radius:5px;padding:1px 8px;background:var(--surface);color:var(--ink-3);font-family:var(--font-mono);
  font-size:16px;margin:0 1px}

/* ══════════════════════════════════════════════════════════════
   미니 파이썬 실행기
   ── 브라우저 안에서 파이썬 문법 일부를 그대로 해석해 실행하고,
      한 줄씩의 실행 기록(trace)을 남겨 관찰·채점에 사용합니다.
   ══════════════════════════════════════════════════════════════ */

function PyErr(msg, line){ const e = new Error(msg); e.pyLine = line; e.isPy = true; return e; }

/* ── 값 도우미 ── */
const F  = v => ({__f:true, v});
const isF = x => !!x && typeof x === 'object' && x.__f === true;
const nv = x => isF(x) ? x.v : x;

function pyStr(v){
  if(v === null || v === undefined) return 'None';
  if(v === true) return 'True';
  if(v === false) return 'False';
  if(isF(v)) return Number.isInteger(v.v) ? v.v.toFixed(1) : String(v.v);
  if(Array.isArray(v)) return '[' + v.map(pyRepr).join(', ') + ']';
  return String(v);
}
function pyRepr(v){ return typeof v === 'string' ? "'" + v + "'" : pyStr(v); }
function truthy(v){
  if(isF(v)) return v.v !== 0;
  if(Array.isArray(v)) return v.length > 0;
  if(v === null || v === undefined) return false;
  if(typeof v === 'string') return v.length > 0;
  if(typeof v === 'number') return v !== 0;
  return !!v;
}

/* ── 1) 낱말 나누기 ── */
const KW = new Set(['if','elif','else','while','for','in','def','return','break','continue',
                    'and','or','not','True','False','None','import','from','pass','is']);
const OPS = ['**','//','==','!=','<=','>=','+=','-=','*=','/=','(',')','[',']',',',':','+','-','*','/','%','<','>','=','.'];

function lex(text, line){
  const t = [];
  let i = 0;
  while(i < text.length){
    const c = text[i];
    if(c === ' ' || c === '\t'){ i++; continue; }
    if(c === '#') break;
    /* 문자열 / f-문자열 */
    if(c === '"' || c === "'" || ((c === 'f' || c === 'F') && (text[i+1] === '"' || text[i+1] === "'"))){
      const isf = (c === 'f' || c === 'F');
      if(isf) i++;
      const q = text[i]; i++;
      let s = '';
      while(i < text.length && text[i] !== q){
        if(text[i] === '\\'){
          const n = text[i+1];
          s += n === 'n' ? '\n' : n === 't' ? '\t' : n === '\\' ? '\\' : n;
          i += 2;
        } else { s += text[i++]; }
      }
      if(i >= text.length) throw PyErr('따옴표를 닫지 않았어요. 문자열은 " 로 시작해 " 로 끝나야 합니다.', line);
      i++;
      t.push({k: isf ? 'fstr' : 'str', v:s, line});
      continue;
    }
    if(/[0-9]/.test(c)){
      let s = '';
      while(i < text.length && /[0-9.]/.test(text[i])) s += text[i++];
      t.push({k:'num', v:s, line});
      continue;
    }
    if(/[A-Za-z_가-힣]/.test(c)){
      let s = '';
      while(i < text.length && /[A-Za-z0-9_가-힣]/.test(text[i])) s += text[i++];
      t.push({k: KW.has(s) ? 'kw' : 'name', v:s, line});
      continue;
    }
    const op = OPS.find(o => text.startsWith(o, i));
    if(op){ t.push({k:'op', v:op, line}); i += op.length; continue; }
    throw PyErr('“' + c + '” 는 파이썬이 알아듣지 못하는 기호예요.', line);
  }
  return t;
}

/* ── 2) 들여쓰기로 구조 만들기 ── */
function parseProgram(src){
  const raw = src.replace(/\r/g, '').split('\n');
  const items = [];
  for(let i = 0; i < raw.length; i++){
    const line = raw[i];
    if(!line.trim() || line.trim()[0] === '#') continue;
    const indent = line.length - line.replace(/^[ \t]+/, '').length;
    const tokens = lex(line, i + 1);
    if(tokens.length) items.push({indent, line:i + 1, tokens});
  }
  let p = 0;
  function block(minIndent){
    const out = [];
    while(p < items.length && items[p].indent >= minIndent){
      const it = items[p];
      if(it.indent > minIndent && out.length === 0)
        throw PyErr('들여쓰기가 갑자기 깊어졌어요. 앞 줄과 칸 수를 맞춰 주세요.', it.line);
      if(it.indent > minIndent) break;
      p++;
      const node = parseStmt(it);
      const last = it.tokens[it.tokens.length - 1];
      if(node.hasBody){
        if(!(last.k === 'op' && last.v === ':'))
          throw PyErr('줄 끝에 콜론(:) 이 빠졌어요. ' + node.kind + ' 문장은 : 으로 끝납니다.', it.line);
        if(p < items.length && items[p].indent > it.indent) node.body = block(items[p].indent);
        else throw PyErr('안쪽에 실행할 내용이 없어요. 다음 줄을 4칸 들여써 주세요.', it.line);
      }
      out.push(node);
    }
    return out;
  }
  const prog = block(0);
  if(p < items.length) throw PyErr('들여쓰기 칸 수가 앞뒤로 어긋납니다.', items[p].line);
  return prog;
}

function parseStmt(it){
  const tk = it.tokens, line = it.line;
  const first = tk[0];
  const mk = (kind, extra) => Object.assign({kind, line, tokens:tk}, extra);

  const needColon = () => {
    const last = tk[tk.length - 1];
    if(!(last.k === 'op' && last.v === ':'))
      throw PyErr('줄 끝에 콜론(:) 이 빠졌어요. ' + first.v + ' 문장은 반드시 : 으로 끝납니다.', line);
  };
  if(first.k === 'kw'){
    switch(first.v){
      case 'if': case 'elif': case 'while': {
        needColon();
        const cond = tk.slice(1, tk.length - 1);
        if(cond.some(x => x.k === 'op' && x.v === '='))
          throw PyErr('조건에는 = 하나를 쓸 수 없어요. 같은지 비교할 때는 == (등호 두 개)를 씁니다.', line);
        if(!cond.length) throw PyErr(first.v + ' 다음에 조건이 없어요.', line);
        return mk(first.v, {hasBody:true, test:parseExpr(cond, line)});
      }
      case 'else':
        needColon();
        return mk('else', {hasBody:true});
      case 'for': {
        const inAt = tk.findIndex(x => x.k === 'kw' && x.v === 'in');
        needColon();
        if(inAt < 0 || tk[1].k !== 'name')
          throw PyErr('for 문은 “for 변수 in 반복대상:” 형태로 씁니다.', line);
        return mk('for', {hasBody:true, target:tk[1].v,
                          iter:parseExpr(tk.slice(inAt + 1, tk.length - 1), line)});
      }
      case 'def': {
        needColon();
        if(tk[1].k !== 'name') throw PyErr('def 다음에는 함수 이름을 씁니다.', line);
        const ps = [];
        for(let i = 3; i < tk.length; i++){
          if(tk[i].k === 'name') ps.push(tk[i].v);
          if(tk[i].k === 'op' && tk[i].v === ')') break;
        }
        return mk('def', {hasBody:true, name:tk[1].v, params:ps});
      }
      case 'return':
        return mk('return', {value: tk.length > 1 ? parseExpr(tk.slice(1), line) : null});
      case 'break': return mk('break');
      case 'continue': return mk('continue');
      case 'pass': return mk('pass');
      case 'import': case 'from': return mk('import');
    }
  }
  /* 대입 여부 확인 (괄호 밖의 = 또는 +=) */
  let depth = 0, eq = -1, aug = null;
  for(let i = 0; i < tk.length; i++){
    const x = tk[i];
    if(x.k === 'op'){
      if('(['.includes(x.v)) depth++;
      else if(')]'.includes(x.v)) depth--;
      else if(depth === 0 && ['=','+=','-=','*=','/='].includes(x.v)){ eq = i; aug = x.v; break; }
    }
  }
  if(eq >= 0){
    return mk('assign', {target:parseExpr(tk.slice(0, eq), line), op:aug,
                         value:parseExpr(tk.slice(eq + 1), line)});
  }
  return mk('expr', {value:parseExpr(tk, line)});
}

/* ── 3) 식 분석 (우선순위 내림차순) ── */
function parseExpr(tk, line){
  let p = 0;
  const peek = () => tk[p];
  const at = (k, v) => tk[p] && tk[p].k === k && (v === undefined || tk[p].v === v);
  const eat = (k, v) => { if(!at(k, v)) throw PyErr('이 줄의 문법을 이해할 수 없어요.', line); return tk[p++]; };

  function orE(){ let l = andE(); while(at('kw','or')){ p++; l = {t:'or', l, r:andE()}; } return l; }
  function andE(){ let l = notE(); while(at('kw','and')){ p++; l = {t:'and', l, r:notE()}; } return l; }
  function notE(){ if(at('kw','not')){ p++; return {t:'not', v:notE()}; } return cmpE(); }
  function cmpE(){
    let l = addE();
    while((at('op') && ['==','!=','<','>','<=','>='].includes(peek().v)) || at('kw','in')){
      const o = tk[p++].v; l = {t:'cmp', o, l, r:addE()};
    }
    return l;
  }
  function addE(){
    let l = mulE();
    while(at('op','+') || at('op','-')){ const o = tk[p++].v; l = {t:'bin', o, l, r:mulE()}; }
    return l;
  }
  function mulE(){
    let l = unE();
    while(at('op','*') || at('op','/') || at('op','//') || at('op','%')){
      const o = tk[p++].v; l = {t:'bin', o, l, r:unE()};
    }
    return l;
  }
  function unE(){
    if(at('op','-')){ p++; return {t:'neg', v:unE()}; }
    if(at('op','+')){ p++; return unE(); }
    return powE();
  }
  function powE(){ const l = post(); if(at('op','**')){ p++; return {t:'bin', o:'**', l, r:unE()}; } return l; }
  function post(){
    let e = prim();
    for(;;){
      if(at('op','(')){ p++; e = {t:'call', fn:e, args:argList()}; }
      else if(at('op','[')){ p++; const ix = orE(); eat('op',']'); e = {t:'index', obj:e, ix}; }
      else if(at('op','.')){ p++; const n = eat('name').v; e = {t:'attr', obj:e, name:n}; }
      else break;
    }
    return e;
  }
  function argList(){
    const a = [];
    if(at('op',')')){ p++; return a; }
    for(;;){ a.push(orE()); if(at('op',',')){ p++; continue; } eat('op',')'); break; }
    return a;
  }
  function prim(){
    if(!peek()) throw PyErr('식이 끝나지 않았어요. 뒤에 값이 빠진 것 같아요.', line);
    const x = tk[p];
    if(x.k === 'num'){ p++; return {t:'num', v:x.v.includes('.') ? F(parseFloat(x.v)) : parseInt(x.v, 10)}; }
    if(x.k === 'str'){ p++; return {t:'str', v:x.v}; }
    if(x.k === 'fstr'){ p++; return {t:'fstr', parts:fparts(x.v, line)}; }
    if(x.k === 'name'){ p++; return {t:'name', v:x.v}; }
    if(x.k === 'kw' && ['True','False','None'].includes(x.v)){
      p++; return {t:'lit', v:x.v === 'True' ? true : x.v === 'False' ? false : null};
    }
    if(x.k === 'op' && x.v === '('){ p++; const e = orE(); eat('op',')'); return e; }
    if(x.k === 'op' && x.v === '['){
      p++; const items = [];
      if(at('op',']')){ p++; return {t:'list', items}; }
      for(;;){ items.push(orE()); if(at('op',',')){ p++; continue; } eat('op',']'); break; }
      return {t:'list', items};
    }
    throw PyErr('“' + x.v + '” 자리를 이해할 수 없어요.', line);
  }
  function fparts(s, ln){
    const out = [];
    let buf = '';
    for(let i = 0; i < s.length; i++){
      if(s[i] === '{'){
        if(buf){ out.push({t:'str', v:buf}); buf = ''; }
        let inner = '', d = 1; i++;
        while(i < s.length && d > 0){
          if(s[i] === '{') d++;
          else if(s[i] === '}'){ d--; if(!d) break; }
          inner += s[i++];
        }
        out.push(parseExpr(lex(inner, ln), ln));
      } else buf += s[i];
    }
    if(buf) out.push({t:'str', v:buf});
    return out;
  }

  const e = orE();
  if(p < tk.length) throw PyErr('“' + tk[p].v + '” 뒤쪽을 이해할 수 없어요.', line);
  return e;
}

/* ── 4) 실행 ── */
function runPython(src, inputs, opts){
  opts = opts || {};
  const out = [];
  const trace = [];
  const inq = (inputs || []).slice();
  let steps = 0, loops = 0;
  const glob = {vars:{}, parent:null};
  let callDepth = 0, lastCall = null;

  const BREAK = {__b:1}, CONT = {__c:1};

  function scopeGet(env, n){
    let e = env;
    while(e){ if(Object.prototype.hasOwnProperty.call(e.vars, n)) return e.vars[n]; e = e.parent; }
    throw PyErr('‘' + n + '’ 라는 이름을 아직 만들지 않았어요. 먼저 값을 넣어 주거나 철자를 확인하세요.', 0);
  }
  function snap(env){
    const o = {};
    const add = e => { for(const k in e.vars){ if(typeof e.vars[k] !== 'function' && !(e.vars[k] && e.vars[k].__fn) && !(e.vars[k] && e.vars[k].__mod)) o[k] = clone(e.vars[k]); } };
    add(glob);
    if(env !== glob) add(env);
    return o;
  }
  function clone(v){ return Array.isArray(v) ? v.map(clone) : v; }

  function emit(node, env, extra){
    if(++steps > 4000) throw PyErr('실행이 너무 길어요. 반복이 끝나지 않는지 확인해 보세요.', node.line);
    trace.push(Object.assign({line:node.line, vars:snap(env), out:out.slice(), depth:callDepth}, extra || {}));
  }

  /* ── 식 계산 ── */
  function ev(n, env, line){
    switch(n.t){
      case 'num': case 'str': case 'lit': return n.v;
      case 'list': return n.items.map(x => ev(x, env, line));
      case 'fstr': return n.parts.map(x => x.t === 'str' ? x.v : pyStr(ev(x, env, line))).join('');
      case 'name': {
        try { return scopeGet(env, n.v); }
        catch(e){ e.pyLine = line; throw e; }
      }
      case 'neg': { const v = ev(n.v, env, line); return isF(v) ? F(-v.v) : -nv(v); }
      case 'not': return !truthy(ev(n.v, env, line));
      case 'and': return truthy(ev(n.l, env, line)) ? ev(n.r, env, line) : false;
      case 'or': { const l = ev(n.l, env, line); return truthy(l) ? l : ev(n.r, env, line); }
      case 'cmp': return compare(n.o, ev(n.l, env, line), ev(n.r, env, line), line);
      case 'bin': return binop(n.o, ev(n.l, env, line), ev(n.r, env, line), line);
      case 'index': {
        const o = ev(n.obj, env, line), i = nv(ev(n.ix, env, line));
        if(!Array.isArray(o) && typeof o !== 'string') throw PyErr('이 값에는 [번호] 로 꺼낼 칸이 없어요.', line);
        const k = i < 0 ? o.length + i : i;
        if(k < 0 || k >= o.length)
          throw PyErr('[' + i + '] 번 칸이 없어요. 항목이 ' + o.length + '개면 0번부터 ' + (o.length - 1) + '번까지 쓸 수 있습니다.', line);
        return o[k];
      }
      case 'attr': return {__bound:ev(n.obj, env, line), name:n.name, node:n};
      case 'call': return call(n, env, line);
    }
    throw PyErr('계산할 수 없는 식입니다.', line);
  }

  function compare(o, a, b, line){
    if(o === 'in'){
      if(Array.isArray(b)) return b.some(x => eqv(x, a));
      if(typeof b === 'string') return b.includes(String(a));
      throw PyErr('in 은 리스트나 문자 안에서만 찾을 수 있어요.', line);
    }
    if(o === '==') return eqv(a, b);
    if(o === '!=') return !eqv(a, b);
    const x = nv(a), y = nv(b);
    if(typeof x !== typeof y)
      throw PyErr('문자와 숫자는 크기를 비교할 수 없어요. int() 로 숫자를 만들어 주세요.', line);
    if(o === '<') return x < y;
    if(o === '>') return x > y;
    if(o === '<=') return x <= y;
    if(o === '>=') return x >= y;
    throw PyErr('알 수 없는 비교입니다.', line);
  }
  function eqv(a, b){
    if(Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x, i) => eqv(x, b[i]));
    return nv(a) === nv(b);
  }

  function binop(o, a, b, line){
    if(o === '+' && (typeof a === 'string' || typeof b === 'string')){
      if(typeof a !== typeof b)
        throw PyErr('문자와 숫자는 + 로 이어 붙일 수 없어요. 숫자를 str() 로 감싸 보세요.', line);
      return a + b;
    }
    if(o === '+' && Array.isArray(a) && Array.isArray(b)) return a.concat(b);
    if(o === '*' && typeof a === 'string') return a.repeat(Math.max(0, nv(b)));
    const x = nv(a), y = nv(b);
    if(typeof x !== 'number' || typeof y !== 'number')
      throw PyErr('숫자가 아닌 값으로 계산하려고 했어요. int() 로 바꿔 보세요.', line);
    const fl = isF(a) || isF(b);
    let r;
    switch(o){
      case '+': r = x + y; break;
      case '-': r = x - y; break;
      case '*': r = x * y; break;
      case '/':
        if(y === 0) throw PyErr('0 으로 나눌 수 없어요.', line);
        return F(x / y);
      case '//':
        if(y === 0) throw PyErr('0 으로 나눌 수 없어요.', line);
        r = Math.floor(x / y); break;
      case '%':
        if(y === 0) throw PyErr('0 으로 나눌 수 없어요.', line);
        r = x - Math.floor(x / y) * y; break;
      case '**': r = Math.pow(x, y); break;
      default: throw PyErr('알 수 없는 연산 “' + o + '”', line);
    }
    return fl ? F(r) : r;
  }

  /* ── 함수 · 내장 명령 ── */
  function call(n, env, line){
    const args = n.args.map(a => ev(a, env, line));
    /* 메서드 호출 */
    if(n.fn.t === 'attr'){
      const base = n.fn.obj;
      if(base.t === 'name' && base.v === 'random'){
        if(n.fn.name === 'randint'){
          const a = nv(args[0]), b = nv(args[1]);
          return a + Math.floor(Math.random() * (b - a + 1));
        }
        if(n.fn.name === 'choice') return args[0][Math.floor(Math.random() * args[0].length)];
        throw PyErr('random 에는 randint 와 choice 만 준비되어 있어요.', line);
      }
      const obj = ev(base, env, line);
      return method(obj, n.fn.name, args, line, base, env);
    }
    if(n.fn.t !== 'name') throw PyErr('함수 이름을 찾을 수 없어요.', line);
    const name = n.fn.v;
    switch(name){
      case 'print': {
        const s = args.map(pyStr).join(' ');
        out.push(s);
        return null;
      }
      case 'input': {
        const prompt = args.length ? pyStr(args[0]) : '';
        const v = inq.length ? String(inq.shift()) : '';
        out.push(prompt + v + '  ⟵ 입력');
        return v;
      }
      case 'int': {
        const v = args[0];
        if(typeof v === 'string'){
          if(!/^-?\d+$/.test(v.trim()))
            throw PyErr('“' + v + '” 는 숫자로 바꿀 수 없어요. 숫자만 입력했는지 확인하세요.', line);
          return parseInt(v.trim(), 10);
        }
        return Math.trunc(nv(v));
      }
      case 'float': return F(parseFloat(typeof args[0] === 'string' ? args[0] : nv(args[0])));
      case 'str': return pyStr(args[0]);
      case 'len':
        if(!Array.isArray(args[0]) && typeof args[0] !== 'string')
          throw PyErr('len() 은 리스트나 문자의 길이만 셀 수 있어요.', line);
        return args[0].length;
      case 'range': {
        const a = args.map(x => nv(x));
        const st = a.length > 1 ? a[0] : 0, en = a.length > 1 ? a[1] : a[0], sp = a.length > 2 ? a[2] : 1;
        const r = [];
        if(sp > 0) for(let i = st; i < en; i += sp) r.push(i);
        else for(let i = st; i > en; i += sp) r.push(i);
        return r;
      }
      case 'sum': return args[0].reduce((s, v) => s + nv(v), 0);
      case 'max': return (args.length === 1 ? args[0] : args).reduce((m, v) => nv(v) > nv(m) ? v : m);
      case 'min': return (args.length === 1 ? args[0] : args).reduce((m, v) => nv(v) < nv(m) ? v : m);
      case 'abs': { const v = args[0]; return isF(v) ? F(Math.abs(v.v)) : Math.abs(nv(v)); }
      case 'round': {
        const d = args.length > 1 ? nv(args[1]) : 0;
        const r = Math.round(nv(args[0]) * Math.pow(10, d)) / Math.pow(10, d);
        return d > 0 ? F(r) : r;
      }
      case 'sorted': return args[0].slice().sort((a, b) => nv(a) > nv(b) ? 1 : nv(a) < nv(b) ? -1 : 0);
      case 'list': return Array.isArray(args[0]) ? args[0].slice() : String(args[0]).split('');
      case 'bool': return truthy(args[0]);
      case 'exit': throw {__exit:true};
    }
    /* 사용자 정의 함수 */
    let fnv;
    try { fnv = scopeGet(env, name); }
    catch(e){
      throw PyErr('‘' + name + '’ 라는 함수를 찾을 수 없어요. def 로 먼저 정의했는지, 철자가 맞는지 확인하세요.', line);
    }
    if(!fnv || !fnv.__fn) throw PyErr('‘' + name + '’ 는 함수가 아니에요.', line);
    if(fnv.params.length !== args.length)
      throw PyErr('‘' + name + '’ 함수는 값 ' + fnv.params.length + '개가 필요한데 ' + args.length + '개를 넣었어요.', line);
    const local = {vars:{}, parent:glob};
    fnv.params.forEach((pn, i) => local.vars[pn] = args[i]);
    callDepth++;
    if(callDepth > 40) throw PyErr('함수가 자기 자신을 너무 깊이 부르고 있어요.', line);
    lastCall = {name, args:args.map(pyStr), line};
    let ret = null;
    try { exec(fnv.body, local); }
    catch(e){
      if(e && e.__ret !== undefined) ret = e.__ret;
      else throw e;
    }
    callDepth--;
    return ret;
  }

  function method(obj, name, args, line, baseNode, env){
    if(Array.isArray(obj)){
      switch(name){
        case 'append': obj.push(args[0]); return null;
        case 'pop': {
          const i = args.length ? nv(args[0]) : obj.length - 1;
          if(i < 0 || i >= obj.length)
            throw PyErr('[' + i + '] 번 칸이 없어 지울 수 없어요. 지금 항목은 ' + obj.length + '개입니다.', line);
          return obj.splice(i, 1)[0];
        }
        case 'insert': obj.splice(nv(args[0]), 0, args[1]); return null;
        case 'remove': {
          const i = obj.findIndex(x => eqv(x, args[0]));
          if(i < 0) throw PyErr('리스트 안에 그 값이 없어요.', line);
          obj.splice(i, 1); return null;
        }
        case 'index': {
          const i = obj.findIndex(x => eqv(x, args[0]));
          if(i < 0) throw PyErr('리스트 안에 그 값이 없어요.', line);
          return i;
        }
        case 'count': return obj.filter(x => eqv(x, args[0])).length;
        case 'sort': obj.sort((a, b) => nv(a) > nv(b) ? 1 : nv(a) < nv(b) ? -1 : 0); return null;
        case 'reverse': obj.reverse(); return null;
        case 'clear': obj.length = 0; return null;
      }
      throw PyErr('리스트에는 ‘' + name + '’ 명령이 없어요.', line);
    }
    if(typeof obj === 'string'){
      switch(name){
        case 'isdigit': return /^\d+$/.test(obj);
        case 'upper': return obj.toUpperCase();
        case 'lower': return obj.toLowerCase();
        case 'strip': return obj.trim();
        case 'replace': return obj.split(args[0]).join(args[1]);
        case 'split': return args.length ? obj.split(args[0]) : obj.split(/\s+/).filter(Boolean);
        case 'count': return obj.split(args[0]).length - 1;
        case 'find': return obj.indexOf(args[0]);
        case 'startswith': return obj.startsWith(args[0]);
        case 'endswith': return obj.endsWith(args[0]);
      }
      throw PyErr('문자에는 ‘' + name + '’ 명령이 없어요.', line);
    }
    throw PyErr('이 값에는 점(.) 명령을 쓸 수 없어요.', line);
  }

  /* ── 대입 ── */
  function assign(node, env){
    const t = node.target;
    let val = ev(node.value, env, node.line);
    if(node.op !== '='){
      const cur = ev(t, env, node.line);
      val = binop(node.op[0], cur, val, node.line);
    }
    if(t.t === 'name'){
      let e = env;
      while(e){ if(Object.prototype.hasOwnProperty.call(e.vars, t.v)){ e.vars[t.v] = val; return; } e = e.parent; }
      env.vars[t.v] = val;
      return;
    }
    if(t.t === 'index'){
      const o = ev(t.obj, env, node.line), i = nv(ev(t.ix, env, node.line));
      if(!Array.isArray(o)) throw PyErr('[번호] 로 값을 넣을 수 있는 것은 리스트뿐이에요.', node.line);
      const k = i < 0 ? o.length + i : i;
      if(k < 0 || k >= o.length)
        throw PyErr('[' + i + '] 번 칸이 없어요. 먼저 append 로 칸을 만들어야 합니다.', node.line);
      o[k] = val; return;
    }
    throw PyErr('이 자리에는 값을 넣을 수 없어요.', node.line);
  }

  /* ── 문장 실행 ── */
  function exec(nodes, env){
    for(let i = 0; i < nodes.length; i++){
      const n = nodes[i];
      switch(n.kind){
        case 'import': case 'pass': break;
        case 'def':
          env.vars[n.name] = {__fn:true, params:n.params, body:n.body, name:n.name};
          emit(n, env, {note:'함수 정의 (아직 실행되지 않음)'});
          break;
        case 'assign': {
          emit(n, env);
          assign(n, env);
          trace[trace.length - 1].after = snap(env);
          break;
        }
        case 'expr': {
          emit(n, env);
          lastCall = null;
          ev(n.value, env, n.line);
          const t = trace[trace.length - 1];
          t.out = out.slice(); t.after = snap(env);
          if(lastCall) t.call = lastCall;
          break;
        }
        case 'return': {
          emit(n, env, {ret:true});
          const v = n.value ? ev(n.value, env, n.line) : null;
          trace[trace.length - 1].retVal = pyStr(v);
          throw {__ret:v};
        }
        case 'break': emit(n, env); throw BREAK;
        case 'continue': emit(n, env); throw CONT;
        case 'if': case 'elif': {
          let done = false, j = i;
          while(j < nodes.length){
            const c = nodes[j];
            if(j > i && !(c.kind === 'elif' || c.kind === 'else')) break;
            if(c.kind === 'else'){
              emit(c, env, {cond:{txt:'그 밖의 경우', res:true}});
              exec(c.body, env); done = true; j++; break;
            }
            const r = truthy(ev(c.test, env, c.line));
            emit(c, env, {cond:{txt:srcOf(c), res:r}});
            if(r){ exec(c.body, env); done = true; j++;
                   while(j < nodes.length && (nodes[j].kind === 'elif' || nodes[j].kind === 'else')) j++;
                   break; }
            j++;
          }
          if(!done) while(j < nodes.length && (nodes[j].kind === 'elif' || nodes[j].kind === 'else')) j++;
          i = j - 1;
          break;
        }
        case 'else': break;
        case 'while': {
          for(;;){
            if(++loops > 20000) throw PyErr('반복이 끝나지 않아요. 조건에 쓰인 변수를 반복 안에서 바꿔 주었는지 확인하세요.', n.line);
            const r = truthy(ev(n.test, env, n.line));
            emit(n, env, {cond:{txt:srcOf(n), res:r}});
            if(!r) break;
            try { exec(n.body, env); }
            catch(e){ if(e === BREAK) break; if(e !== CONT) throw e; }
          }
          break;
        }
        case 'for': {
          const it = ev(n.iter, env, n.line);
          if(!Array.isArray(it) && typeof it !== 'string')
            throw PyErr('for 문은 리스트나 range() 처럼 여러 개인 값만 하나씩 꺼낼 수 있어요.', n.line);
          let broke = false;
          for(let k = 0; k < it.length; k++){
            if(++loops > 20000) throw PyErr('반복 횟수가 너무 많아요.', n.line);
            env.vars[n.target] = it[k];
            emit(n, env, {loop:{i:k + 1, n:it.length, name:n.target, val:pyStr(it[k])}});
            try { exec(n.body, env); }
            catch(e){ if(e === BREAK){ broke = true; break; } if(e !== CONT) throw e; }
          }
          if(broke) {}
          break;
        }
        default: throw PyErr('실행할 수 없는 문장입니다.', n.line);
      }
    }
  }
  function srcOf(n){ return n.tokens.map(t => t.k === 'str' ? '"' + t.v + '"' : t.v).join(' ').replace(/ :$/, ''); }

  let error = null;
  try{
    const prog = parseProgram(src);
    exec(prog, glob);
  }catch(e){
    if(e && e.__exit){ /* 정상 종료 */ }
    else if(e && e.__ret !== undefined){ /* 최상위 return 무시 */ }
    else if(e && e.isPy) error = {msg:e.message, line:e.pyLine || 0};
    else error = {msg:(e && e.message) ? e.message : '알 수 없는 오류가 발생했어요.', line:0};
  }
  return {out, trace, error, vars:glob.vars};
}

/* ── 자동 채점 ── */
function grade(src, tests){
  const results = [];
  for(const t of tests){
    const r = runPython(src, t.inputs, {});
    const got = r.out.filter(l => !l.endsWith('  ⟵ 입력')).map(s => s.trim());
    const want = t.expect.map(s => s.trim());
    const pass = !r.error && got.length === want.length && got.every((g, i) => g === want[i]);
    results.push({inputs:t.inputs, want, got, pass, error:r.error});
  }
  return results;
}

/* ══════════════════════════════════════════════════════════════
   화면 구성
   ══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ── 엔트리 블록 그리기 ── */
function findClose(s, from, open, close){
  let d = 1, i = from;
  while(i < s.length){
    if(s.startsWith(open, i)){ d++; i += 2; continue; }
    if(s.startsWith(close, i)){ d--; if(!d) return i; i += 2; continue; }
    i++;
  }
  return s.length;
}
function tpl(s){
  let out = '', i = 0;
  while(i < s.length){
    const two = s.substr(i, 2);
    if(two === '[['){
      const j = findClose(s, i + 2, '[[', ']]');
      out += '<span class="ef drop">' + esc(s.slice(i + 2, j)) + '</span>'; i = j + 2;
    } else if(two === '(('){
      const j = findClose(s, i + 2, '((', '))');
      out += '<span class="ef">' + esc(s.slice(i + 2, j)) + '</span>'; i = j + 2;
    } else if(two === '{{' || two === '<<'){
      const bool = two === '<<';
      const j = findClose(s, i + 2, two, bool ? '>>' : '}}');
      const inner = s.slice(i + 2, j);
      const bar = inner.indexOf('|');
      const c = bar > 0 ? inner.slice(0, bar) : 'calc';
      const body = bar > 0 ? inner.slice(bar + 1) : inner;
      const col = (CAT[c] || CAT.calc);
      out += '<span class="ei' + (bool ? ' bool' : '') + '" style="--ic:' + col.c + ';--bd:' + col.d + '">' + tpl(body) + '</span>';
      i = j + 2;
    } else { out += esc(s[i]); i++; }
  }
  return out;
}
function blockHTML(b){
  const c = CAT[b.cat] || CAT.data;
  const st = 'style="--bc:' + c.c + ';--bd:' + c.d + '"';
  const ln = b.line ? ' data-line="' + b.line + '" tabindex="0" role="button"' : '';
  const note = b.note ? '<div class="eb-note">↳ ' + esc(b.note) + '</div>' : '';
  if(b.body){
    let h = '<div class="ebc" ' + st + '>';
    h += '<div class="eb ebc-top" ' + st + ln + '>' + tpl(b.t) + '</div>';
    h += '<div class="ebc-row"><div class="ebc-spine"></div><div class="ebc-in">' + b.body.map(blockHTML).join('') + '</div></div>';
    if(b.elseBody){
      h += '<div class="eb ebc-mid" ' + st + (b.elseLine ? ' data-line="' + b.elseLine + '" tabindex="0" role="button"' : '') + '>' + tpl(b.elseT || '아니면') + '</div>';
      h += '<div class="ebc-row"><div class="ebc-spine"></div><div class="ebc-in">' + b.elseBody.map(blockHTML).join('') + '</div></div>';
    }
    h += '<div class="eb ebc-bot" ' + st + '></div></div>' + note;
    return h;
  }
  return '<div class="eb' + (b.hat ? ' hat' : '') + '" ' + st + ln + '>' + tpl(b.t) + '</div>' + note;
}
function stackHTML(blocks){
  return '<div class="canvas"><div class="stack">' + blocks.map(blockHTML).join('') + '</div></div>';
}

/* ── 파이썬 코드 색칠 ── */
const RX_KW = /^(if|elif|else|while|for|in|def|return|break|continue|and|or|not|True|False|None|import|pass|is)$/;
const RX_FN = /^(print|input|int|float|str|len|range|sum|max|min|abs|round|sorted|list|bool|append|pop|insert|remove|index|count|sort|reverse|clear|randint|choice|isdigit|upper|lower|strip|replace|split|find|startswith|endswith|exit)$/;
function hi(src){
  let out = '', i = 0;
  while(i < src.length){
    const c = src[i];
    if(c === '#'){ out += '<span class="tk-cm">' + esc(src.slice(i)) + '</span>'; break; }
    if(c === '"' || c === "'" || ((c === 'f') && (src[i+1] === '"' || src[i+1] === "'"))){
      let j = c === 'f' ? i + 1 : i;
      const q = src[j]; j++;
      while(j < src.length && src[j] !== q){ if(src[j] === '\\') j++; j++; }
      out += '<span class="tk-st">' + esc(src.slice(i, j + 1)) + '</span>'; i = j + 1; continue;
    }
    if(/[0-9]/.test(c) && !/[A-Za-z_]/.test(src[i-1] || ' ')){
      let j = i; while(j < src.length && /[0-9.]/.test(src[j])) j++;
      out += '<span class="tk-nu">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;
    }
    if(/[A-Za-z_]/.test(c)){
      let j = i; while(j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j);
      const cls = RX_KW.test(w) ? 'tk-kw' : RX_FN.test(w) ? 'tk-fn' : '';
      out += cls ? '<span class="' + cls + '">' + w + '</span>' : esc(w);
      i = j; continue;
    }
    if(/[+\-*/%=<>!:,.()[\]]/.test(c)){ out += '<span class="tk-op">' + esc(c) + '</span>'; i++; continue; }
    out += esc(c); i++;
  }
  return out;
}
function editorHTML(src, opts){
  opts = opts || {};
  const lines = src.split('\n');
  let h = '<div class="editor"><div class="ed-bar">'
        + '<span class="lamp" style="background:#ff5f57"></span><span class="lamp" style="background:#febc2e"></span>'

  if(/^def /.test(s)) return '함수의 <b>설계도만 만들어 둡니다.</b> 아직 아무 일도 일어나지 않고, 부를 때 실행됩니다.';
  if(/\.append\(/.test(s)) return '리스트 <b>맨 뒤에 새 칸을 만들어</b> 값을 넣습니다.';

function fillParse(tpl){
  const out = [], rx = /\{\{(.+?)\}\}/g;
  let last = 0, m;
  while((m = rx.exec(tpl))){
    if(m.index > last) out.push({t:'text', v:tpl.slice(last, m.index)});
    const p = m[1].split('#');
    out.push({t:'blank', ans:p[0].split('|').map(x => x.trim()), hint:p[1] || ''});
    last = rx.lastIndex;
  }
  if(last < tpl.length) out.push({t:'text', v:tpl.slice(last)});
  return out;
}
function fillBlanks(u){
  const list = [], t = FILL[u.id] || {};
  Object.keys(t).forEach(n => fillParse(t[n]).forEach((s, j) => { if(s.t === 'blank') list.push({k:n + ':' + j, ans:s.ans}); }));
  return list;
}
const attr = s => esc(s).replace(/"/g, '&quot;');

      if(s.t === 'text') return hi(s.v);
      const k = ln + ':' + j, v = st.vals[k] || '';
      const w = Math.max.apply(null, s.ans.map(a => a.length).concat([2]));
      return '<input class="fb' + (fillOk(v, s.ans) ? ' ok' : '') + '" type="text" data-k="' + k + '" data-ans="' + attr(s.ans.join('|'))
        + '" data-hint="' + attr(s.hint) + '" style="width:calc(' + w + 'ch + 18px)" value="' + attr(v)
        + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="' + ln + '번째 줄 빈칸">';
    }).join('');
    return '<div class="pl" data-line="' + ln + '"><span class="ln">' + ln + '</span><span class="src">' + body + '</span></div>';
  }).join('');
  let done = '';
  if(st.done){
    const r = runPython(u.py, u.inputs, {});
    const out = r.out.map(l => l.endsWith('  ⟵ 입력') ? '<span class="ask">' + esc(l) + '</span>' : esc(l)).join('\n');
    done = `<div class="fbdone">
      <h3>모든 빈칸을 채웠습니다</h3>
      <p style="margin:0;color:var(--ink-2)">완성한 코드를 실제로 실행하면 이렇게 나옵니다.</p>
      <div class="console"><div class="panel-hd"><span class="dot" style="background:#28c840"></span>실행 결과</div>
        <div class="console-body">${out || '<span class="empty">출력이 없습니다.</span>'}</div></div>
      <button class="rb primary" type="button" data-go="lab">직접 실습으로 ▸</button>
      <button class="rb" type="button" id="f-reset">처음부터 다시 ↺</button>
    </div>`;
  }
  return `
  <p class="lbl">블록 프로그램을 보고, 빈칸에 들어갈 파이썬 코드를 직접 입력하세요. 맞으면 초록색이 되고 다음 칸으로 넘어갑니다.</p>
  <div class="fbbar"><span>채운 빈칸 <b id="fb-count">${n} / ${blanks.length}</b></span>
    <span class="fbhint" id="fb-hint">빈칸을 누르면 힌트가 나타납니다.</span></div>
  <div class="bridge">
    <div class="panel"><div class="panel-hd"><span class="dot" style="background:${CAT[u.cat].c}"></span>엔트리 블록<span class="hint">이 프로그램을 파이썬으로</span></div>${stackHTML(u.blocks)}</div>
    <div class="bridge-arrow">→</div>
    <div class="panel"><div class="panel-hd"><span class="dot" style="background:#3776AB"></span>파이썬 코드<span class="hint">빈칸을 채우세요</span></div>
      <div class="editor"><div class="ed-bar"><span class="lamp" style="background:#ff5f57"></span><span class="lamp" style="background:#febc2e"></span><span class="lamp" style="background:#28c840"></span><span style="margin-left:4px">main.py</span></div>
      <div class="ed-body">${rows}</div></div></div>
  </div>${done}`;
}
function fillCheck(inp){
  const u = UNITS[ui], st = S[u.id].fill, ans = inp.dataset.ans.split('|');
  st.vals[inp.dataset.k] = inp.value;
  const ok = fillOk(inp.value, ans);
  inp.classList.toggle('ok', ok);
  inp.classList.toggle('no', !ok && inp.value.trim().length >= Math.min.apply(null, ans.map(a => a.length)));
  const blanks = fillBlanks(u);
  const n = blanks.filter(b => fillOk(st.vals[b.k] || '', b.ans)).length;
  const c = $('#fb-count'); if(c) c.textContent = n + ' / ' + blanks.length;
  if(ok){ const nx = document.querySelector('.fb:not(.ok)'); if(nx) nx.focus(); }
  if(n === blanks.length && !st.done){ st.done = true; mark(u.id, 'fill'); setTimeout(draw, 350); }
}

/* ══ 모드 5 · 직접 실습 · 채점 ══ */
function focusLab(){
  const t = $('#l-code'); if(!t) return;
  t.focus({preventScroll:true});
  const m = t.value.match(/^.*=[ \t]*$/m);
  const p = m ? t.value.indexOf(m[0]) + m[0].length : t.value.length;
  t.setSelectionRange(p, p);
}
function viewLab(u){
  const st = S[u.id];
  const li = st.labIdx || 0, lab = u.labs[li];
  if(st.code[li] === undefined) st.code[li] = lab.starter;
  return `
  <div class="lab-tabs" role="tablist">${labTabsHTML(u)}</div>
  <div class="mission">
    <span class="mtag">실습 과제 ${li + 1} / ${u.labs.length}</span>
    <p>${lab.mission}</p>
  </div>
  <div class="labgrid">
    <div class="panel">
      <div class="panel-hd"><span class="dot" style="background:#3776AB"></span>내 코드 (직접 고쳐 쓰세요)
        <span class="hint">Tab = 4칸 · Ctrl+Enter = 채점</span></div>
      <textarea class="edit-area" id="l-code" spellcheck="false" aria-label="파이썬 코드 편집기">${esc(st.code[li])}</textarea>
      <div class="labbar">
        <button class="rb primary" type="button" id="l-run">실행 ▶</button>
        <button class="rb" type="button" id="l-grade">채점하기 ✓</button>
        <button class="rb" type="button" id="l-hint">힌트</button>
        <button class="rb" type="button" id="l-reset">처음 코드로 ↺</button>
      </div>
    </div>
    <div class="console">
      <div class="panel-hd"><span class="dot" style="background:#28c840"></span>실행 결과 · 채점</div>
      <div class="console-body" id="l-out" style="max-height:none;min-height:210px"><span class="empty">코드를 고친 뒤 실행 또는 채점을 눌러 보세요.</span></div>
    </div>
  </div>
  <div class="verdict" id="l-verdict"></div>`;
}
function labRun(u){
  const li = S[u.id].labIdx || 0, lab = u.labs[li];
  const code = $('#l-code').value;
  S[u.id].code[li] = code;
  const r = runPython(code, (lab.tests[0] || {inputs:[]}).inputs, {});
  const box = $('#l-out');
  let h = r.out.length ? r.out.map(l => l.endsWith('  ⟵ 입력') ? '<span class="ask">' + esc(l) + '</span>' : esc(l)).join('\n') : '<span class="empty">출력이 없습니다.</span>';
  if(r.error) h += '\n<span class="err">✕ ' + (r.error.line ? r.error.line + '번 줄 — ' : '') + esc(r.error.msg) + '</span>';
  box.innerHTML = h + '\n<span class="empty">첫 번째 검사 입력(' + ((lab.tests[0] || {inputs:[]}).inputs.join(', ') || '없음') + ')으로 실행했습니다.</span>';
  $('#l-verdict').className = 'verdict';
}
function labGrade(u){
  const li = S[u.id].labIdx || 0, lab = u.labs[li];
  const code = $('#l-code').value;
  S[u.id].code[li] = code;
  const rs = grade(code, lab.tests);
  const pass = rs.every(r => r.pass);
  $('#l-out').innerHTML = rs.map((r, i) => {
    const head = (r.pass ? '<span style="color:var(--ok)">● 통과</span>' : '<span style="color:var(--bad)">● 실패</span>')
      + '  검사 ' + (i + 1) + (r.inputs.length ? ' · 입력 ' + r.inputs.join(', ') : '');
    if(r.error) return head + '\n   오류 : ' + esc(r.error.msg);
    if(r.pass) return head + '\n   출력 ' + esc(r.got.join(' / '));
    return head + '\n   기대한 출력 : ' + esc(r.want.join(' / ')) + '\n   실제 출력   : ' + esc(r.got.join(' / ') || '(없음)');
  }).join('\n\n');
  const v = $('#l-verdict');
  v.className = 'verdict show ' + (pass ? 'ok' : 'ng');
  v.innerHTML = pass
    ? '<b>모든 검사를 통과했습니다.</b> 블록으로 하던 일을 파이썬 코드로 직접 완성했습니다.'
    : '<b>아직 통과하지 못한 검사가 있습니다.</b> 기대한 출력과 실제 출력의 차이를 확인해 보세요. 띄어쓰기 하나도 다르면 안 됩니다.';
  if(pass) markLabProblem(u.id, li, u.labs.length);
  const tabs = $('.lab-tabs');
  if(tabs) tabs.innerHTML = labTabsHTML(u);
}

/* ── 그리기 ── */
function draw(){
  const u = UNITS[ui];
  drawRail(); drawModes(); drawHead();
  const st = $('#stage');
  st.innerHTML = mode === 'map' ? viewMap(u)
               : mode === 'compare' ? viewCompare(u)
               : mode === 'run' ? viewRun(u)
               : mode === 'fill' ? viewFill(u)
               : viewLab(u);
  if(mode === 'run') runPrepare(u);
  if(mode === 'lab') focusLab();
  drawProgress();
}

/* ── 이벤트 ── */
document.addEventListener('click', e => {
  const u = UNITS[ui];
  const unitBtn = e.target.closest('.unit-btn');
  if(unitBtn){ stopAuto(); ui = +unitBtn.dataset.i; draw(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const modeBtn = e.target.closest('.mode-btn');
  if(modeBtn){ stopAuto(); mode = modeBtn.dataset.m; draw(); return; }

  /* 블록 ↔ 코드 짝 표시 */
  const line = e.target.closest('[data-line]');
  if(line && (mode === 'compare' || mode === 'run' || mode === 'fill')){
    const n = line.dataset.line;
    const on = !line.classList.contains('sel');
    document.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
    if(on) document.querySelectorAll('[data-line="' + n + '"]').forEach(el => el.classList.add('sel'));
    return;
  }
  /* 확인 문제 */
  const q = e.target.closest('.qopt');
  if(q){
    S[u.id].quiz = +q.dataset.q;
    if(+q.dataset.q === u.quiz.ans) mark(u.id, 'quiz');
    draw(); return;
  }
  /* 실행 조작 */
  if(e.target.id === 'r-step'){ if(RUN.idx < RUN.trace.length - 1){ RUN.idx++; paintRun(u); } return; }
  if(e.target.id === 'r-reset'){ runPrepare(u); return; }
  if(e.target.id === 'r-end'){ stopAuto(); RUN.idx = RUN.trace.length - 1; paintRun(u); return; }
  if(e.target.id === 'r-auto'){
    if(RUN.timer){ stopAuto(); }
    else{
      e.target.textContent = '멈춤 ❚❚';
      RUN.timer = setInterval(() => {
        if(RUN.idx >= RUN.trace.length - 1){ stopAuto(); return; }
        RUN.idx++; paintRun(u);
      }, 750);
    }
    return;
  }
  const go = e.target.closest('[data-go]');
  if(go){ mode = go.dataset.go; draw(); return; }
  if(e.target.id === 'f-reset'){ S[u.id].fill = {vals:{}, done:false}; draw(); return; }
  /* 실습 문제 탭 */
  const labTab = e.target.closest('.lab-tab');
  if(labTab){ S[u.id].labIdx = +labTab.dataset.labI; draw(); return; }
  /* 실습 */
  if(e.target.id === 'l-run'){ labRun(u); return; }
  if(e.target.id === 'l-grade'){ labGrade(u); return; }
  if(e.target.id === 'l-reset'){ const li = S[u.id].labIdx || 0; S[u.id].code[li] = u.labs[li].starter; draw(); return; }
  if(e.target.id === 'l-hint'){
    const v = $('#l-verdict');
    v.className = 'verdict show'; v.style.background = 'var(--warn-bg)'; v.style.color = 'var(--warn)';
    v.innerHTML = '<b>힌트</b> · ' + u.labs[S[u.id].labIdx || 0].hint;
    return;
  }
  if(e.target.id === 'reset-all'){
    done = {}; try { localStorage.removeItem('b2p-done'); } catch(err){}
    UNITS.forEach(x => { S[x.id] = newState(x); });
    draw(); return;
  }
  if(e.target.id === 'theme-btn'){
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    return;
  }
});
document.addEventListener('keydown', e => {
  if(e.target.matches('[data-line]') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); e.target.click(); }
  if(e.target.id === 'l-code' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); labGrade(UNITS[ui]); }
  if(e.target.id === 'l-code' && e.key === 'Tab'){
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 4;
  }
});
document.addEventListener('input', e => {
  if(e.target.classList && e.target.classList.contains('fb')) fillCheck(e.target);
});
document.addEventListener('focusin', e => {
  if(e.target.classList && e.target.classList.contains('fb')){
    const h = $('#fb-hint');
    if(h) h.textContent = e.target.dataset.hint ? '힌트 · ' + e.target.dataset.hint : '';
  }
});
document.addEventListener('change', e => {
  if(e.target.dataset.in !== undefined){
    S[UNITS[ui].id].inputs[+e.target.dataset.in] = e.target.value;
    runPrepare(UNITS[ui]);
  }
});

draw();
</script>
